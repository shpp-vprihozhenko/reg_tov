<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстратор товарів + Автопошук</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, addDoc, onSnapshot, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDkysW3a6iWFfJ2C2lav44czx4XVRC0TOs",
            authDomain: "p1pizza-byl0wd.firebaseapp.com",
            projectId: "p1pizza-byl0wd",
            storageBucket: "p1pizza-byl0wd.appspot.com",
            messagingSenderId: "915455456710",
            appId: "1:915455456710:web:76d0ad9339309d3319aec7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        window.products = [];

        onAuthStateChanged(auth, (user) => {
            const statusEl = document.getElementById('authStatus');
            if (user) {
                currentUser = user;
                statusEl.innerText = "База онлайн";
                statusEl.classList.replace('text-gray-400', 'text-green-500');
                subscribeToProducts();
            } else {
                signInAnonymously(auth).catch(console.error);
            }
        });

        function subscribeToProducts() {
            const q = collection(db, 'public_products');
            onSnapshot(q, (snapshot) => {
                window.products = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderInventory();
            });
        }

        window.saveProduct = async (productData) => {
            if (!currentUser) return;
            try {
                await addDoc(collection(db, 'public_products'), {
                    ...productData,
                    createdAt: serverTimestamp()
                });
                showToast("Товар додано!");
            } catch (err) { console.error(err); }
        };

        window.deleteFromCloud = async (id) => {
            if (confirm("Видалити?")) {
                await deleteDoc(doc(db, 'public_products', id));
                showToast("Видалено");
            }
        };
    </script>
    <style>
        body { background-color: #f3f4f6; font-family: 'Segoe UI', sans-serif; }
        .active-tab { border-bottom: 3px solid #6366f1; color: #6366f1; }
        #reader { width: 100% !important; border-radius: 1rem; overflow: hidden; }
        video { width: 100% !important; border-radius: 1rem; }
        
        .loading-shimmer {
            background: linear-gradient(90deg, #f3f4f6 25%, #e5e7eb 50%, #f3f4f6 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="p-0 md:p-4">
    <!-- Модальне вікно сканера -->
    <div id="scannerModal" class="hidden fixed inset-0 bg-black bg-opacity-80 z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-2xl overflow-hidden shadow-2xl">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50">
                <h3 class="font-bold">Сканування</h3>
                <button onclick="stopScanner()" class="text-2xl font-bold text-gray-400">&times;</button>
            </div>
            <div id="reader"></div>
        </div>
    </div>

    <!-- Модальне вікно камери -->
    <div id="cameraModal" class="hidden fixed inset-0 bg-black bg-opacity-90 z-50 flex flex-col items-center justify-center p-4">
        <div class="w-full max-w-lg bg-black rounded-2xl overflow-hidden relative">
            <video id="video" autoplay playsinline class="w-full"></video>
            <canvas id="canvas" class="hidden"></canvas>
            <div class="absolute bottom-6 w-full flex justify-around items-center px-10">
                <button onclick="closeCamera()" class="bg-white/20 text-white p-4 rounded-full">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-width="2"/></svg>
                </button>
                <button onclick="takeSnapshot()" class="bg-white w-16 h-16 rounded-full border-4 border-gray-300 active:scale-90 transition-transform"></button>
                <div class="w-14"></div>
            </div>
        </div>
    </div>

    <nav class="max-w-4xl mx-auto bg-white shadow-sm mb-6 sticky top-0 z-20">
        <div class="flex border-b">
            <button onclick="switchTab('add')" id="tab-add" class="flex-1 py-4 text-center font-bold text-gray-600 active-tab">Додати</button>
            <button onclick="switchTab('inventory')" id="tab-inventory" class="flex-1 py-4 text-center font-bold text-gray-600">Склад</button>
        </div>
        <div class="px-4 py-1 text-[10px] text-right text-gray-400" id="authStatus">Завантаження...</div>
    </nav>

    <div class="max-w-4xl mx-auto px-4 pb-20">
        <div id="page-add" class="space-y-6">
            <div class="bg-white rounded-2xl p-6 shadow-md border-t-4 border-indigo-500">
                <form id="productForm" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Штрих-код</label>
                        <div class="flex gap-2">
                            <input type="text" id="barcode" required oninput="debouncedSearch()" class="flex-1 p-3 bg-gray-50 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Скануйте або введіть">
                            <button type="button" onclick="startScanner()" class="bg-indigo-600 text-white p-3 rounded-lg shadow-md">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 4v1m6 11h2m-6 0h-2v4m0-11v-3m4 3h3m-9 0h-3m3 0a2 2 0 012 2v2.5M3 10v3a2 2 0 002 2h3m11 0h3a2 2 0 002-2v-3M19 10V7a2 2 0 00-2-2h-3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            </button>
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Назва та опис товару</label>
                        <div class="relative">
                            <textarea id="description" required rows="2" class="w-full p-3 bg-gray-50 border rounded-lg focus:ring-2 focus:ring-indigo-500 transition-all" placeholder="Назва товару підтягнеться автоматично..."></textarea>
                            <div id="searchLoader" class="hidden absolute inset-0 bg-gray-50/80 flex items-center justify-center rounded-lg">
                                <div class="flex items-center gap-2 text-indigo-600 text-sm font-bold">
                                    <svg class="animate-spin h-5 w-5" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                    Шукаємо назву...
                                </div>
                            </div>
                        </div>
                        <div id="searchSource" class="text-[10px] text-gray-400 mt-1 hidden italic">Дані з OpenFoodFacts</div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Термін придатності</label>
                            <input type="date" id="expiryDate" required class="w-full p-3 bg-gray-50 border rounded-lg focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Дії</label>
                            <button type="button" onclick="openCamera()" class="w-full bg-gray-100 p-3 rounded-lg border flex items-center justify-center gap-2 text-indigo-600 font-bold hover:bg-gray-200">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" stroke-width="2"/></svg>
                                Фото
                            </button>
                        </div>
                    </div>
                    
                    <div id="previewContainer" class="hidden relative mt-2">
                        <img id="imagePreview" class="w-full max-h-48 object-cover rounded-xl shadow-sm border">
                        <button type="button" onclick="clearImage()" class="absolute top-2 right-2 bg-red-500 text-white rounded-full p-1 shadow-lg">&times;</button>
                    </div>
                    
                    <button type="submit" class="w-full bg-indigo-600 text-white p-4 rounded-xl font-bold shadow-lg active:scale-95 transition-all">Зберегти на склад</button>
                </form>
            </div>
        </div>

        <div id="page-inventory" class="hidden">
            <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-gray-100 text-gray-500 text-[10px] uppercase">
                        <tr><th class="p-4">Термін</th><th class="p-4">Фото</th><th class="p-4">Товар</th><th class="p-4"></th></tr>
                    </thead>
                    <tbody id="inventoryList" class="divide-y divide-gray-100"></tbody>
                </table>
            </div>
        </div>
    </div>
    
    <div id="toast" class="fixed bottom-8 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full hidden z-50"></div>

    <script>
        let currentImageData = '';
        let html5QrCode;
        let stream;
        let searchTimeout;

        // --- АВТОПОШУК ТОВАРУ ---
        function debouncedSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(fetchProductDetails, 800);
        }

        async function fetchProductDetails() {
            const barcode = document.getElementById('barcode').value.trim();
            if (barcode.length < 8) return;

            const loader = document.getElementById('searchLoader');
            const descArea = document.getElementById('description');
            const sourceInfo = document.getElementById('searchSource');

            loader.classList.remove('hidden');
            
            try {
                // Використовуємо Open Food Facts API (безкоштовно та відкрито)
                const res = await fetch(`https://world.openfoodfacts.org/api/v0/product/${barcode}.json`);
                const data = await res.json();

                if (data.status === 1) {
                    const p = data.product;
                    // Пріоритет: Українська назва -> Загальна назва -> Назва бренду + Категорія
                    const name = p.product_name_uk || p.product_name || p.generic_name || 
                                 (p.brands ? `${p.brands} ${p.categories ? p.categories.split(',')[0] : ''}` : '');
                    
                    if (name) {
                        descArea.value = name;
                        sourceInfo.classList.remove('hidden');
                        showToast("Товар знайдено!");
                    }
                    
                    // Якщо в базі є фото, а ми ще не зробили своє - підтягуємо
                    if (p.image_url && !currentImageData) {
                        currentImageData = p.image_url;
                        document.getElementById('imagePreview').src = p.image_url;
                        document.getElementById('previewContainer').classList.remove('hidden');
                    }
                }
            } catch (err) {
                console.error("Помилка пошуку:", err);
            } finally {
                loader.classList.add('hidden');
            }
        }

        // --- ФУНКЦІЇ КАМЕРИ ---
        async function openCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                document.getElementById('video').srcObject = stream;
                document.getElementById('cameraModal').classList.remove('hidden');
            } catch (err) { alert("Камера недоступна"); }
        }

        function closeCamera() {
            if (stream) stream.getTracks().forEach(t => t.stop());
            document.getElementById('cameraModal').classList.add('hidden');
        }

        function takeSnapshot() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            currentImageData = canvas.toDataURL('image/jpeg', 0.6);
            document.getElementById('imagePreview').src = currentImageData;
            document.getElementById('previewContainer').classList.remove('hidden');
            closeCamera();
        }

        function clearImage() {
            currentImageData = '';
            document.getElementById('previewContainer').classList.add('hidden');
        }

        // --- СКАНЕР ---
        async function startScanner() {
            document.getElementById('scannerModal').classList.remove('hidden');
            html5QrCode = new Html5Qrcode("reader");
            try {
                await html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (text) => {
                    document.getElementById('barcode').value = text;
                    stopScanner();
                    fetchProductDetails(); // Шукаємо після сканування
                });
            } catch (err) { stopScanner(); }
        }

        function stopScanner() {
            if (html5QrCode?.isScanning) {
                html5QrCode.stop().then(() => document.getElementById('scannerModal').classList.add('hidden'));
            } else {
                document.getElementById('scannerModal').classList.add('hidden');
            }
        }

        // --- ФОРМА ТА ТАБИ ---
        document.getElementById('productForm').addEventListener('submit', async e => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.innerText = "Зберігаємо...";

            await window.saveProduct({
                barcode: document.getElementById('barcode').value,
                description: document.getElementById('description').value,
                expiryDate: document.getElementById('expiryDate').value,
                image: currentImageData || 'https://via.placeholder.com/150?text=Немає+фото'
            });

            e.target.reset();
            clearImage();
            document.getElementById('searchSource').classList.add('hidden');
            btn.disabled = false;
            btn.innerText = "Зберегти на склад";
        });

        function switchTab(tab) {
            document.getElementById('page-add').classList.toggle('hidden', tab !== 'add');
            document.getElementById('page-inventory').classList.toggle('hidden', tab !== 'inventory');
            document.getElementById('tab-add').classList.toggle('active-tab', tab === 'add');
            document.getElementById('tab-inventory').classList.toggle('active-tab', tab === 'inventory');
            if (tab === 'inventory') renderInventory();
        }

        function renderInventory() {
            const list = document.getElementById('inventoryList');
            list.innerHTML = '';
            const today = new Date();
            today.setHours(0,0,0,0);
            const inSevenDays = new Date(today);
            inSevenDays.setDate(today.getDate() + 7);

            window.products.sort((a,b) => new Date(a.expiryDate) - new Date(b.expiryDate)).forEach(p => {
                const exp = new Date(p.expiryDate);
                const isUrgent = exp <= inSevenDays;
                const isExpired = exp < today;

                const row = document.createElement('tr');
                row.className = isUrgent ? (isExpired ? "bg-red-200" : "bg-yellow-400 font-bold") : "hover:bg-gray-50";
                
                row.innerHTML = `
                    <td class="p-4 text-xs">
                        <span class="${isExpired ? 'text-red-700 underline' : ''}">${p.expiryDate}</span>
                    </td>
                    <td class="p-4"><img src="${p.image}" class="w-12 h-12 object-cover rounded-lg border-2 border-white shadow-sm"></td>
                    <td class="p-4">
                        <div class="text-[9px] opacity-60 font-mono">${p.barcode}</div>
                        <div class="text-sm line-clamp-2">${p.description}</div>
                    </td>
                    <td class="p-4 text-right">
                        <button onclick="window.deleteFromCloud('${p.id}')" class="text-gray-400 hover:text-red-600 p-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" stroke-width="2" stroke-linecap="round"/></svg>
                        </button>
                    </td>
                `;
                list.appendChild(row);
            });
        }

        function showToast(m) {
            const t = document.getElementById('toast');
            t.innerText = m; t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 2500);
        }
    </script>
</body>
</html>
